openapi: 3.1.0
info:
  title: Klarvid VoxCPM TTS
  version: 0.1.0
  description: |
    Local text-to-speech API (VoxCPM2). Not OpenAI-compatible.
    Success synthesis responses are raw audio/wav bytes (PCM16 mono 48 kHz).
    One GPU lock: concurrent callers wait or receive 503 after GPU_LOCK_TIMEOUT.
  contact:
    name: Klarvid
servers:
  - url: http://127.0.0.1:8000
    description: Default Windows bind
tags:
  - name: system
  - name: tts
  - name: clone
  - name: voices
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: GPU and model status
      responses:
        "200":
          description: Server is up (may still be busy synthesizing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/voices:
    post:
      tags: [voices]
      operationId: createVoice
      summary: Register a reusable cloned voice
      description: Saves sample audio + transcript. Does not use the GPU. Returns voice_id.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [prompt_text, reference_audio]
              properties:
                prompt_text:
                  type: string
                  description: Exact transcript of the sample audio
                reference_audio:
                  type: string
                  format: binary
                name:
                  type: string
      responses:
        "201":
          description: Voice stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceResponse"
        "400":
          description: Empty prompt_text or empty file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
    get:
      tags: [voices]
      operationId: listVoices
      summary: List saved voices
      responses:
        "200":
          description: Voice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceListResponse"
  /v1/voices/{voice_id}:
    parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-f0-9]{12}$"
    get:
      tags: [voices]
      operationId: getVoice
      summary: Get one saved voice
      responses:
        "200":
          description: Voice metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceResponse"
        "400":
          description: Invalid id format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "404":
          $ref: "#/components/responses/VoiceNotFound"
    delete:
      tags: [voices]
      operationId: deleteVoice
      summary: Delete a saved voice
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
        "404":
          $ref: "#/components/responses/VoiceNotFound"
  /v1/tts:
    post:
      tags: [tts]
      operationId: postTts
      summary: Synthesize speech (complete WAV)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TtsRequest"
            examples:
              vi:
                value:
                  text: Xin chào, Klarvid.
              voice_id:
                value:
                  text: Đọc đoạn này bằng giọng đã lưu.
                  voice_id: a1b2c3d4e5f6
      responses:
        "200":
          description: WAV audio
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/VoiceNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/GpuBusy"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/tts/stream:
    post:
      tags: [tts]
      operationId: postTtsStream
      summary: Synthesize speech (chunked WAV)
      description: |
        First chunk is a WAV header with unknown sizes (0xFFFFFFFF), then PCM16 frames.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TtsRequest"
      responses:
        "200":
          description: Chunked audio/wav
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/VoiceNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/GpuBusy"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/clone:
    post:
      tags: [clone]
      operationId: postClone
      summary: Clone voice from reference audio (complete WAV)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CloneForm"
      responses:
        "200":
          description: WAV audio
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          description: Empty text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          $ref: "#/components/responses/GpuBusy"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/clone/stream:
    post:
      tags: [clone]
      operationId: postCloneStream
      summary: Clone voice (chunked WAV)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CloneForm"
      responses:
        "200":
          description: Chunked audio/wav
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          description: Empty text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          $ref: "#/components/responses/GpuBusy"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  schemas:
    TtsRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          description: >
            Text to speak. Optional voice design prefix `(description)rest of text`.
        cfg_value:
          type: number
          default: 2.0
        inference_timesteps:
          type: integer
          default: 10
        seed:
          type: integer
          nullable: true
        voice_id:
          type: string
          nullable: true
          description: 12-hex id from POST /v1/voices
          pattern: "^[a-f0-9]{12}$"
    VoiceResponse:
      type: object
      required: [id, prompt_text, created_at]
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        prompt_text:
          type: string
        created_at:
          type: string
          format: date-time
    VoiceListResponse:
      type: object
      required: [voices]
      properties:
        voices:
          type: array
          items:
            $ref: "#/components/schemas/VoiceResponse"
    CloneForm:
      type: object
      required: [text, reference_audio]
      properties:
        text:
          type: string
        reference_audio:
          type: string
          format: binary
          description: 3–10s speaker clip (wav/mp3)
        prompt_text:
          type: string
          description: Exact transcript of reference_audio for higher similarity
        denoise:
          type: boolean
          default: false
        cfg_value:
          type: number
        inference_timesteps:
          type: integer
        seed:
          type: integer
    HealthResponse:
      type: object
      required:
        - status
        - busy
        - queue_waiters
        - sample_rate
        - model
      properties:
        status:
          type: string
          enum: [ok, busy]
        gpu:
          type: string
          nullable: true
        vram_allocated_gb:
          type: number
        vram_reserved_gb:
          type: number
        busy:
          type: boolean
        queue_waiters:
          type: integer
        optimize:
          type: boolean
        load_denoiser:
          type: boolean
        model:
          type: string
        device:
          type: string
        sample_rate:
          type: integer
          example: 48000
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
          example: GPU bận, thử lại sau.
  responses:
    GpuBusy:
      description: GPU lock wait exceeded GPU_LOCK_TIMEOUT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: GPU bận, thử lại sau.
    VoiceNotFound:
      description: voice_id does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: voice_id không tồn tại
    ServerError:
      description: Inference failure or CUDA OOM
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    ValidationError:
      description: Request body failed schema validation
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: array
                items:
                  type: object
